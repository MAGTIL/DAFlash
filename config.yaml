# ⚡ DA Flash (Dopamine Flash) 小狼毫多巴胺输入特效配置文件
daflash:
  enabled: true
  gravity_strength: 650.0     # 向上加速度 (px/s^2)
  max_particles: 1024         # 粒子池上限
  combo_shake: true           # 连击暴击模式微震效果
  combo_wpm_threshold: 55.0   # 连击暴击触发打字速率 (WPM)
  theme: "cyberpunk"          # 特效主题可选: cyberpunk / golden / classic / rainbow
  text_scale: 1.25            # 汉字粒子缩放比例
  commit_burst_count: 24      # 候选字词上屏爆破火花粒子数
